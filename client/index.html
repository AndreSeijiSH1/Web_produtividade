<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2557d6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <title>Organizador Acadêmico</title>
    <script>
      // Aplica o tema antes de desenhar a página, para não piscar branco.
      (function () {
        try {
          var t = localStorage.getItem('tema') || 'sistema';
          if (t === 'sistema') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
          document.documentElement.dataset.tema = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
